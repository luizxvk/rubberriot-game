# Rubber Riot MP (org Fokus Lab, Sao Paulo). UMA maquina so': as salas moram na memoria.
# Dorme sem ninguem conectado (suspend) e acorda na primeira conexao, igual ao revora-realtime.
app = "rubber-riot-mp"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ROVEX_API = "https://api.tryrovex.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
