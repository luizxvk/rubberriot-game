<!doctype html><meta charset=utf-8><pre id=o>wait</pre>
<script type=module>
import { loadArsenal, arsenalLoaded, debugParts } from '/src/arsenal.js';
const o = document.getElementById('o');
function slice(P, y0, y1) { const p = P.geo.attributes.position; let a = [1e9,1e9,1e9], b = [-1e9,-1e9,-1e9]; for (let i = 0; i < p.count; i++) { const y = p.getY(i); if (y < y0 || y > y1) continue; const v = [p.getX(i), y, p.getZ(i)]; for (let k=0;k<3;k++){a[k]=Math.min(a[k],v[k]);b[k]=Math.max(b[k],v[k]);} } return [(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2, b[0]-a[0], b[2]-a[2]]; }
try {
  await loadArsenal();
  for (let i = 0; i < 200 && !arsenalLoaded(); i++) await new Promise(r => setTimeout(r, 100));
  const A = debugParts(), out = {};
  for (const id of ['pistol_charger_2','pistol_2','pistol_charger_4','pistol_charger_3']) { const P = A[id]; if (!P) { out[id] = null; continue; } P.geo.computeBoundingBox(); const b = P.geo.boundingBox, h = b.max.y - b.min.y;
    out[id] = { min: b.min.toArray(), max: b.max.toArray(), top: slice(P, b.max.y - h*0.05, b.max.y), mid: slice(P, b.min.y+h*0.475, b.min.y+h*0.525), bot: slice(P, b.min.y, b.min.y + h*0.05) }; }
  const G = A.pistol_2; if (G) { const p = G.geo.attributes.position; const hist = {}; for (let i=0;i<p.count;i++){ const k=(Math.round(p.getZ(i)*20)/20); hist[k]=Math.min(hist[k]??9,p.getY(i)); } out.pistol_2_lowY_byZ = hist; }
  o.textContent = 'JSON' + JSON.stringify(out) + 'END';
} catch (e) { o.textContent = 'ERR ' + e + e.stack; }
</script>
