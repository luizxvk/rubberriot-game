<!doctype html><meta charset="utf-8"><title>Prévia: borrão e lápis</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Grandstander:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e4d8;overflow:hidden;font-family:Grandstander,sans-serif;color:#141210}
#ui{position:fixed;left:24px;top:20px;display:flex;gap:10px;align-items:center}
h1{font-family:'Bowlby One';font-size:26px;margin:0 14px 0 0}
button{font:800 17px Grandstander;padding:8px 16px;border:3px solid #141210;border-radius:12px;background:#ffd23a;box-shadow:4px 4px 0 #141210;cursor:pointer}
button:focus-visible{outline:3px solid #e8402a;outline-offset:3px}
#fase{position:fixed;left:24px;bottom:20px;font-size:20px;font-weight:800}
</style>
<div id="ui"><h1>Borrão e lápis</h1><button id="bMorre">Morrer</button><button id="bRenasce">Renascer</button><button id="bLoop">Repetir sozinho</button></div>
<div id="fase"></div>
<script type="module">
// Previa (06/11, aprovado na conversa, NAO e o jogo): morte vira borrao de nanquim que escorre; renascer e o lapis desenhando
import * as THREE from 'three';
import { Character } from '../src/character.js';
import { ink, PAL } from '../src/toon.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight); r.setPixelRatio(Math.min(2, devicePixelRatio)); r.setClearColor(0xe9e4d8); document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a847a, 1.6)); const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(3, 6, 4); scene.add(dl);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 50); cam.position.set(0, 1.5, 4.6); cam.lookAt(0, 0.75, 0);
// chao de papel
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshBasicMaterial({ color: 0xdcd5c4 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const ch = new Character('red', 'Teste'); scene.add(ch.root); ch.root.rotation.y = Math.PI - 0.45; // de frente pra camera, um pouco de lado
ch.root.traverse(o => { if (o.isSprite) o.visible = false; }); // plaquinha de nome fora da previa
// partes do boneco (malha com contorno) em ordem de altura: o lapis desenha de baixo pra cima
const parts = [];
ch.root.updateMatrixWorld(true);
ch.root.traverse(o => { if (o.isMesh && !o.material?.isShaderMaterial && o.visible) { /* braco e perna (mangueira) tambem */ const p = new THREE.Vector3(); o.getWorldPosition(p); parts.push({ m: o, mat: o.material, y: p.y, p }); } });
parts.sort((a, b) => a.y - b.y);
const paper = new THREE.MeshBasicMaterial({ color: 0xf6efdc });
const inkMat = new THREE.MeshToonMaterial({ color: 0x141210 });
// poca de nanquim: disco de borda ondulada + pingos
function puddleGeo() { const s = new THREE.Shape(), n = 40; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, rr = 1 + Math.sin(a * 5) * 0.12 + Math.sin(a * 3 + 1) * 0.08; const x = Math.cos(a) * rr, y = Math.sin(a) * rr; i ? s.lineTo(x, y) : s.moveTo(x, y); } return new THREE.ShapeGeometry(s); }
const puddle = new THREE.Mesh(puddleGeo(), new THREE.MeshBasicMaterial({ color: 0x141210, transparent: true })); puddle.rotation.x = -Math.PI / 2; puddle.position.y = 0.012; puddle.scale.setScalar(0.001); scene.add(puddle);
const shine = new THREE.Mesh(new THREE.CircleGeometry(0.12, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })); shine.rotation.x = -Math.PI / 2; shine.position.set(-0.25, 0.015, -0.15); puddle.add(shine); shine.position.set(-0.35, 0.3, 0.003); shine.rotation.x = 0;
const drips = []; for (let i = 0; i < 9; i++) { const d = ink(new THREE.SphereGeometry(0.07 + Math.random() * 0.05, 10, 8), 0x141210, 0); d.visible = false; scene.add(d); drips.push({ m: d, a: Math.random() * 6.28, h: 0.4 + Math.random() * 1.1, sp: 0.6 + Math.random() * 0.7 }); }
// lapis: corpo amarelo sextavado, ponta de madeira, grafite, borracha rosa
const pencil = new THREE.Group();
{ const body = ink(new THREE.CylinderGeometry(0.06, 0.06, 0.62, 6), 0xffd23a, 0.012); body.position.y = 0.42; pencil.add(body);
  const wood = ink(new THREE.ConeGeometry(0.06, 0.13, 6), 0xe8c38a, 0.01); wood.rotation.x = Math.PI; wood.position.y = 0.045; pencil.add(wood);
  const lead = ink(new THREE.ConeGeometry(0.022, 0.05, 6), 0x2a2724, 0.006); lead.rotation.x = Math.PI; lead.position.y = -0.01; pencil.add(lead);
  const band = ink(new THREE.CylinderGeometry(0.064, 0.064, 0.06, 12), 0xb9b4a8, 0.01); band.position.y = 0.76; pencil.add(band);
  const er = ink(new THREE.CylinderGeometry(0.06, 0.06, 0.08, 12), 0xf08aa0, 0.01); er.position.y = 0.83; pencil.add(er); }
pencil.rotation.z = -0.5; pencil.visible = false; scene.add(pencil);
// riscos de grafite que o lapis deixa no ar (somem quando a cor entra)
const scribble = new THREE.Group(); scene.add(scribble);
function scrib(p) { const pts = []; for (let i = 0; i < 6; i++) pts.push(p.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.18, (Math.random() - 0.5) * 0.35))); const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3(pts).getPoints(24)), new THREE.LineBasicMaterial({ color: 0x55504a, transparent: true, opacity: 0.8 })); scribble.add(l); }

let mode = 'idle', T = 0, loop = q.get('loop') !== '0';
const fase = document.getElementById('fase');
const setAll = (fn) => parts.forEach(fn);
function reset() { setAll(p => { p.m.material = p.mat; p.m.visible = true; p.m.scale.copy(p.s0 ||= p.m.scale.clone()); }); ch.body.scale.set(1, 1, 1); ch.body.position.y = 0; ch.root.visible = true; puddle.scale.setScalar(0.001); puddle.material.opacity = 1; drips.forEach(d => d.m.visible = false); pencil.visible = false; scribble.clear(); }
function die() { reset(); mode = 'melt'; T = 0; fase.textContent = 'Morreu: amolece, escorre e vira poça de nanquim'; }
function respawn() { reset(); mode = 'draw'; T = 0; setAll(p => { p.m.visible = false; p.m.material = paper; }); fase.textContent = 'Renasce: o lápis desenha o traço, depois entra a cor'; }
document.getElementById('bMorre').onclick = () => { loop = false; die(); };
document.getElementById('bRenasce').onclick = () => { loop = false; respawn(); };
document.getElementById('bLoop').onclick = () => { loop = true; die(); };
const sm = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
let last = performance.now(), clockT = 0;
function step(dt) {
  clockT += dt; T += dt;
  ch.update(dt, { anim: 'idle', alive: true, speed: 0, t: clockT });
  if (mode === 'melt') {
    // 0-0.25 tranco (estica de susto), 0.25-1.4 escorre: achata, alarga, vira tinta; 1.4-2.6 poca abre e pinga; depois seca
    const a = sm(T / 0.25), b = sm((T - 0.25) / 1.15), c = sm((T - 1.0) / 1.2), e = sm((T - 3.2) / 0.9);
    const sy = (1 + 0.12 * a * (1 - b)) * (1 - 0.94 * b), sx = 1 + 0.5 * b * (1 - c * 0.6);
    ch.body.scale.set(sx, Math.max(0.04, sy), sx);
    ch.body.position.y = -0.03 * b;
    setAll(p => { p.m.material = b > 0.35 ? inkMat : p.mat; });
    ch.root.visible = b < 0.97;
    puddle.scale.setScalar(0.001 + 0.95 * sm((T - 0.6) / 1.3) * (1 - 0.15 * e)); puddle.material.opacity = 1 - e;
    drips.forEach((d, i) => { const k = (T - 0.45 - i * 0.07) * d.sp; d.m.visible = k > 0 && k < 1.2 && T < 3.2; if (!d.m.visible) return; const rr = 0.25 + 0.25 * Math.min(1, k); d.m.position.set(Math.cos(d.a) * rr, Math.max(0.04, d.h * (1 - k * k * 1.4)), Math.sin(d.a) * rr); d.m.scale.set(1, 1 + k * 0.8, 1); });
    if (T > 4.3) { if (loop) respawn(); else mode = 'idle'; }
  } else if (mode === 'draw') {
    // 0-1.8 o lapis passa em cada peca de baixo pra cima: aparece so o traco no papel (pop); 1.8-2.8 a cor sobe
    const n = parts.length, k = Math.min(n, Math.floor(T / 1.8 * n));
    pencil.visible = T < 2.0;
    for (let i = 0; i < n; i++) { const p = parts[i]; if (i < k) { if (!p.m.visible) { p.m.visible = true; p.born = T; if (i % 2 === 0) scrib(p.p); } const u = sm((T - p.born) / 0.12); p.m.scale.copy(p.s0).multiplyScalar(0.6 + 0.4 * u); } }
    const cur = parts[Math.min(n - 1, k)]; if (cur && pencil.visible) { const w = clockT * 26; pencil.position.lerp(cur.p.clone().add(new THREE.Vector3(Math.cos(w) * 0.12 + 0.12, 0.02 + Math.sin(w * 1.3) * 0.05, Math.sin(w) * 0.12 + 0.2)), 0.5); }
    const fill = sm((T - 1.9) / 0.9); const topY = parts[0].y + (parts[n - 1].y - parts[0].y + 0.2) * fill;
    if (T > 1.9) setAll(p => { if (p.y <= topY) p.m.material = p.mat; });
    scribble.children.forEach(l => l.material.opacity = 0.8 * (1 - fill));
    if (T > 1.9 && T < 2.15) ch.body.scale.setScalar(1 + Math.sin((T - 1.9) / 0.25 * Math.PI) * 0.06); else ch.body.scale.setScalar(1);
    if (T > 4.0) { scribble.clear(); if (loop) die(); else mode = 'idle'; }
  }
}
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); r.render(scene, cam); requestAnimationFrame(frame); }
// print headless: ?shot=melt|draw&t=segundos
if (q.get('rec')) { loop = true; die(); window.__frame = (dt) => { step(dt); r.render(scene, cam); return r.domElement.toDataURL('image/jpeg', 0.9); }; document.title = 'pronto'; }
else if (q.get('shot')) { loop = false; (q.get('shot') === 'melt' ? die : respawn)(); const N = Math.round(+q.get('t') * 60); for (let i = 0; i < N; i++) step(1 / 60); r.render(scene, cam); document.title = 'pronto'; }
else { die(); requestAnimationFrame(frame); }
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
</script>
