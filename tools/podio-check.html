<!doctype html><meta charset="utf-8"><title>Podio</title><style>body{margin:0;background:#000}</style>
<script type="module">
// Mede o que fica NA FRENTE do podio (09/11): usa o cenario desenhado de verdade, nao as caixas de colisao. ?m=vila&n=1 (noite)
import * as THREE from 'three';
import { getMap } from '../shared/map.js';
import { buildWorld } from '../src/world.js';
import { podiumSpot, podiumCam, POD_LOOK_Y } from '../shared/podiumspot.js';
const q = new URLSearchParams(location.search), M = getMap(q.get('m') || 'vila'), night = q.get('n') === '1';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
const W = buildWorld(scene, M); if (night) W.setNight(true);
await W.ready; await new Promise(f => setTimeout(f, 1200));
const S = podiumSpot(M), P = podiumCam(M, S), sn = Math.sin(S.yaw), cs = Math.cos(S.yaw);
const L = (x, y, z) => new THREE.Vector3(S.x + cs * x + sn * z, S.y + y, S.z - sn * x + cs * z);
const look = L(0, POD_LOOK_Y, 0), base = new THREE.Vector3(...P.b), side = new THREE.Vector3(cs, 0, -sn);
cam.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.max(6.5, 8.2 / cam.aspect) / 2 / S.d)); cam.updateProjectionMatrix();
const FAR = S.d - 1.9, RW = 800, RH = 400, rt = new THREE.WebGLRenderTarget(RW, RH), buf = new Uint8Array(RW * RH * 4);
const ov = new THREE.ShaderMaterial({ side: THREE.DoubleSide, uniforms: { f: { value: S.y + 0.25 } },
  vertexShader: 'varying float vY; void main(){ vec4 w=vec4(position,1.); #ifdef USE_INSTANCING\n w=instanceMatrix*w;\n #endif\n w=modelMatrix*w; vY=w.y; gl_Position=projectionMatrix*viewMatrix*w; }'.replace('#ifdef', '\n#ifdef'),
  fragmentShader: 'uniform float f; varying float vY; void main(){ if(vY<f) discard; gl_FragColor=vec4(1.); }' });
const hidden = []; scene.traverse(o => { const m = o.material; if (o.visible && (o.isSprite || o.isPoints || o.isLine || (m && !Array.isArray(m) && (m.blending === THREE.AdditiveBlending || (m.transparent && m.opacity < 0.6) || m.colorWrite === false)))) { o.visible = false; hidden.push(o); } });
function measure(off) {
  cam.position.copy(base).addScaledVector(side, off); cam.lookAt(look); cam.far = FAR; cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  const bgS = scene.background, fogS = scene.fog; scene.background = null; scene.fog = null; scene.overrideMaterial = ov; r.setRenderTarget(rt); r.setClearColor(0, 1); r.clear(); r.render(scene, cam); r.readRenderTargetPixels(rt, 0, 0, RW, RH, buf); r.setRenderTarget(null); scene.overrideMaterial = null; scene.background = bgS; scene.fog = fogS;
  const px = [[-3.9, 0], [3.9, 0], [-3.9, 4], [3.9, 4]].map(([x, y]) => L(x, y, 0).project(cam));
  const x0 = Math.max(0, Math.floor((Math.min(...px.map(p => p.x)) + 1) / 2 * RW)), x1 = Math.min(RW - 1, Math.ceil((Math.max(...px.map(p => p.x)) + 1) / 2 * RW)), y0 = Math.max(0, Math.floor((Math.min(...px.map(p => p.y)) + 1) / 2 * RH)), y1 = Math.min(RH - 1, Math.ceil((Math.max(...px.map(p => p.y)) + 1) / 2 * RH));
  let all = 0, st = 0; const cov = []; for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++) if (buf[(y * RW + x) * 4] > 127) { all++; if (x >= x0 && x <= x1 && y >= y0 && y <= y1) { st++; cov.push([x, y]); } }
  return { frame: all / (RW * RH) * 100, stage: st / Math.max(1, (x1 - x0 + 1) * (y1 - y0 + 1)) * 100, cov };
}
const res = [-0.4, 0, 0.4].map(measure), worst = res.reduce((a, b) => b.stage > a.stage ? b : a), off = [-0.4, 0, 0.4][res.indexOf(worst)];
measure(off);
// quem e: alguns raios nos pixels cobertos
const ray = new THREE.Raycaster(), who = {}; ray.far = FAR; ray.near = 0.1; const meshes = []; scene.traverse(o => { if (!o.isMesh) return; let v = true; for (let p = o; p; p = p.parent) v &&= p.visible; if (v && !o.userData.cellHull && !/outline|hull/i.test(o.name)) meshes.push(o); });
const step = Math.max(1, Math.floor(worst.cov.length / 24));
for (let i = 0; i < worst.cov.length; i += step) { const [x, y] = worst.cov[i]; ray.setFromCamera({ x: (x + 0.5) / RW * 2 - 1, y: (y + 0.5) / RH * 2 - 1 }, cam); const h = ray.intersectObjects(meshes, false).find(k => k.point.y > S.y + 0.25); if (!h) continue; const n = h.object.name || h.object.parent?.name || h.object.geometry?.type; (who[n] ||= { n: 0, at: h.point.toArray().map(v => +v.toFixed(1)) }).n++; }
window.__res = { map: M.id, night, spot: { x: S.x, y: S.y, z: S.z, yaw: +S.yaw.toFixed(2), d: S.d, fixed: !!M.podium }, frame: +worst.frame.toFixed(1), stage: +worst.stage.toFixed(1), off, who };
// foto pra olhar: bonecos de mentira nos 3 lugares
for (const x of [0, 2.5, -2.5]) { const g = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.6, 16), new THREE.MeshBasicMaterial({ color: 0xff2030 })); g.position.copy(L(x, 1.3, 0)); scene.add(g); }
for (const o of hidden) o.visible = true;
cam.position.copy(base).addScaledVector(side, off); cam.far = 600; cam.lookAt(look); cam.updateProjectionMatrix(); r.render(scene, cam); document.title = 'pronto';
</script>
